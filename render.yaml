services:
  # Backend API
  - type: web
    name: seculetter-hubspot-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: seculetter-hubspot-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://seculetter-hubspot-dashboard.onrender.com
    autoDeploy: true

  # Frontend Dashboard
  - type: web
    name: seculetter-hubspot-dashboard
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://seculetter-hubspot-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: seculetter-hubspot-api
          property: host
    autoDeploy: true

databases:
  - name: seculetter-hubspot-db
    region: singapore
    plan: free
    databaseName: seculetter_hubspot
    user: seculetter

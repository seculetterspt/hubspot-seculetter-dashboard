services:
  # Backend API + Frontend (single service)
  - type: web
    name: seculetter-hubspot-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install --include=dev && npm run build && npm run build:frontend
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: seculetter-hubspot-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://seculetter-hubspot-api.onrender.com
    autoDeploy: true

databases:
  - name: seculetter-hubspot-db
    region: singapore
    plan: free
    databaseName: seculetter_hubspot
    user: seculetter
